name: Swift checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Detect documentation-only pull requests
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            bash scripts/ci/docs-only-change.sh HEAD^1 HEAD >> "$GITHUB_OUTPUT"
          else
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi
  compatibility-macos-14:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: macos-14
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      OPENDICTATE_SIGN_IDENTITY: '-'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identify Swift toolchain for the build cache
        id: toolchain
        run: printf 'key=%s\n' "$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore SwiftPM build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swiftpm-${{ github.job }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: |
            swiftpm-${{ github.job }}-${{ steps.toolchain.outputs.key }}-
      - name: Record actual macOS 14 toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
      - name: Test offline on macOS 14
        run: swift test -Xswiftc -warnings-as-errors
      - name: Build and verify macOS 14 bundle
        run: ./scripts/build-app.sh
  test-and-build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: macos-15
    timeout-minutes: 15
    env:
      OPENDICTATE_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Identify Swift toolchain for the build cache
        id: toolchain
        run: printf 'key=%s\n' "$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore SwiftPM build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swiftpm-${{ github.job }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: |
            swiftpm-${{ github.job }}-${{ steps.toolchain.outputs.key }}-
      - name: Record toolchain and platform
        run: |
          sw_vers
          uname -m
          swift --version
          swift format --version
      - name: Check formatting
        run: swift format lint --strict --configuration .swift-format --recursive Sources Tests Package.swift
      - name: Test including synthetic audio files
        run: swift test -Xswiftc -warnings-as-errors
      - name: Test offline acceptance tools
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Check shell syntax and commit whitespace
        run: |
          bash -n scripts/build-app.sh
          bash -n scripts/verify-app.sh
          bash -n scripts/store-api-key.sh
          bash -n scripts/package-ci-app.sh
          bash -n scripts/package-release-app.sh
          bash -n scripts/tests/test-verify-app.sh
          bash -n script/build_and_run.sh
          git diff --check HEAD^ HEAD
      - name: Build and verify local ad-hoc bundle
        env:
          OPENDICTATE_SIGN_IDENTITY: '-'
        run: ./scripts/build-app.sh
      - name: Check bundle verifier regressions
        run: bash scripts/tests/test-verify-app.sh .build/OpenDictate.app
      - name: Package and verify development artifact
        id: package
        run: |
          bash scripts/package-ci-app.sh .build/OpenDictate.app "$RUNNER_TEMP/opendictate-artifact"
          printf 'source_revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload development artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenDictate-dev-${{ steps.package.outputs.source_revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/opendictate-artifact/OpenDictate-dev-*.zip
            ${{ runner.temp }}/opendictate-artifact/manifest.json
            ${{ runner.temp }}/opendictate-artifact/SHA256SUMS
            ${{ runner.temp }}/opendictate-artifact/README.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: false
          overwrite: false
