name: iOS prototype
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'scripts/ci/check-ios-prototype.sh'
      - '.github/workflows/ios-prototype.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'scripts/ci/check-ios-prototype.sh'
      - '.github/workflows/ios-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the optional iOS prototype
        run: bash scripts/ci/check-ios-prototype.sh
