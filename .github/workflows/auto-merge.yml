# Kopie aus HerrStolzier/claude-config (ci/auto-merge.yml); dort pflegen, dann scripts/install-repo-gate.py erneut ausführen.
# Hinweis: Merges über GITHUB_TOKEN starten keine push-Workflows auf dem Haupt-Branch (dort laufen nur Prüfungen).
# Basti liest und mergt keine PRs. Dieser Workflow mergt Claudes fertige PRs selbst (Regeln in auto_merge.py):
# kein Entwurf, eigener Branch, jeder Code-Commit mit `Reviewed-by:`, alle Prüfungen grün, kein Konflikt.
name: Auto-Merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_run:
    workflows: ["Swift checks", "iOS prototype", "Linux checks", "Repository hygiene", "Windows checks"]
    types: [completed]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: read

concurrency:
  group: auto-merge-${{ github.head_ref || github.event.workflow_run.head_branch || 'alle' }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-Merge
    if: >-
      (github.event_name != 'pull_request' || (!github.event.pull_request.draft
        && github.event.pull_request.head.repo.full_name == github.repository))
      && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository
        && (github.event.workflow_run.event == 'pull_request' || (github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch != github.event.repository.default_branch))))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Immer die Fassung vom Haupt-Branch: Ein PR soll nicht mit seiner eigenen Fassung über sich entscheiden.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts/auto_merge.py
          sparse-checkout-cone-mode: false
      - name: Fertige PRs mergen
        run: python3 .github/scripts/auto_merge.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_MERGE_HAS_CI: "1"
