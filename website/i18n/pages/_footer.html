<footer class="foot">
<div class="wrap">
<div class="run-track" aria-hidden="true">
<span class="run-prompt" data-od="icon" data-name="prompt" data-size="36" data-tone="muted"></span>
<div class="run-blink"></div>
</div>
<div class="foot-row">
<span data-od="wordmark" data-size="20" data-still><span class="od-wordmark od-wordmark-20">{{site.wordmark}}</span></span>
<nav aria-label="{{foot_label}}" class="foot-nav">
<a href="{{site.repo}}">GitHub</a>
<a href="{{site.repo}}/issues/new?template=beta-rueckmeldung.md">{{report}}</a>
<a href="{{site.support}}/kontakt">{{foot_contact}}</a>
<a href="{{site.support}}/impressum">{{foot_imprint}}</a>
<a href="{{site.support}}/datenschutz">{{foot_privacy}}</a>
<a href="{{site.repo}}/blob/main/LICENSE">{{foot_license}}</a>
</nav>
<p class="meta">© 2026 HerrStolzier</p>
</div>
</div>
</footer>
