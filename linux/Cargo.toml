[package]
name = "opendictate"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "Linux clipboard MVP for OpenDictate. Not product scope."

[[bin]]
name = "opendictate"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
hex = "0.4"
hmac = "0.12"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
